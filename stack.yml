version: "3.9"

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    configs:
      - source: gateway_nginx_conf
        target: /etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - backend

  user-service:
    image: ${USER_SERVICE_IMAGE}
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - user_service_data:/tmp
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      backend:
        aliases:
          - user-service

  search-service:
    image: ${SEARCH_SERVICE_IMAGE}
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    volumes:
      - search_service_data:/tmp
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      backend:
        aliases:
          - search-service

  ws-service:
    image: ${WS_SERVICE_IMAGE}
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ws-service-$${HOSTNAME}
    volumes:
      - ws_service_data:/tmp
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    networks:
      backend:
        aliases:
          - ws-service

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_eda
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch_data_es9:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - backend

networks:
  backend:
    driver: overlay

configs:
  gateway_nginx_conf:
    file: ./gateway/nginx.conf

volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data_es9:
  user_service_data:
  search_service_data:
  ws_service_data:
