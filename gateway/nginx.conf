worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'upstream="$upstream_addr" upstream_status="$upstream_status" '
                    'host="$host" uri="$uri" req_id="$request_id"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Required when proxy_pass uses a variable (see map below)
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Guard rails for long-lived WebSocket traffic so it does not starve HTTP API requests.
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
    limit_conn_zone $server_name zone=ws_global:10m;

    upstream user_service {
        server user-service:8080;
        keepalive 256;
    }

    upstream search_service {
        server search-service:8080;
        keepalive 256;
    }

    # Balance long-lived WebSockets across scaled ws-service replicas (docker-compose replicas: N).
    # least_conn picks the peer with the fewest active connections (ip_hash would stick by client IP).
    upstream ws_service {
        least_conn;
        server ws-service:8080;
        keepalive 512;
    }

    # These three legacy paths exist on both services for GET; user-service also uses POST on
    # /chats/me and /chats/{id}/messages — only GET goes to search-service.
    map $request_method $search_read_or_user {
        default http://user-service:8080;
        GET http://search-service:8080;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        location = / {
            default_type application/json;
            return 200 '{"entrypoints":{"prefixed":{"user":"/user/","search":"/search/"},"legacy":{"user-service":"default","search-service":["GET /users","GET /chats/me","GET /chats/{chatId}/messages"],"websocket":["/ws","/ws-raw"]}}}';
        }

        # STOMP over SockJS and raw WebSocket (ws-service)
        location /ws-raw {
            proxy_pass http://ws_service;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host ws-service:8080;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            limit_conn ws_per_ip 1000;
            limit_conn ws_global 60000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SockJS info/XHR endpoints are plain HTTP; do not force Upgrade headers here.
        location = /ws/info {
            proxy_pass http://ws_service;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host ws-service:8080;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SockJS websocket transport endpoint requires upgrade headers.
        location ~ ^/ws/.*/websocket$ {
            proxy_pass http://ws_service;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host ws-service:8080;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            limit_conn ws_per_ip 1000;
            limit_conn ws_global 60000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Other SockJS HTTP endpoints (xhr, xhr_streaming, etc.)
        location /ws {
            proxy_pass http://ws_service;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host ws-service:8080;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /user/ {
            proxy_pass http://user_service/;
        }

        location = /user {
            return 301 /user/;
        }

        location /search/ {
            proxy_pass http://search_service/;
        }

        location = /search {
            return 301 /search/;
        }

        # --- Legacy: exact three search-service read APIs (GET only; see map) ---
        location = /users {
            proxy_pass $search_read_or_user;
        }

        location = /chats/me {
            proxy_pass $search_read_or_user;
        }

        # Quoted regex so {36} is a PCRE quantifier; unquoted { would start an nginx block
        location ~ "^/chats/[0-9a-fA-F-]{36}/messages$" {
            proxy_pass $search_read_or_user;
        }

        location / {
            proxy_pass http://user_service;
        }
    }
}
