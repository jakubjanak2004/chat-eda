worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Required when proxy_pass uses a variable (see map below)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream user_service {
        server user-service:8080;
    }

    upstream search_service {
        server search-service:8080;
    }

    # These three legacy paths exist on both services for GET; user-service also uses POST on
    # /chats/me and /chats/{id}/messages — only GET goes to search-service.
    map $request_method $search_read_or_user {
        default http://user-service:8080;
        GET http://search-service:8080;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = / {
            default_type application/json;
            return 200 '{"entrypoints":{"prefixed":{"user":"/user/","search":"/search/"},"legacy":{"user-service":"default","search-service":["GET /users","GET /chats/me","GET /chats/{chatId}/messages"]}}}';
        }

        location /user/ {
            proxy_pass http://user_service/;
        }

        location = /user {
            return 301 /user/;
        }

        location /search/ {
            proxy_pass http://search_service/;
        }

        location = /search {
            return 301 /search/;
        }

        # --- Legacy: exact three search-service read APIs (GET only; see map) ---
        location = /users {
            proxy_pass $search_read_or_user;
        }

        location = /chats/me {
            proxy_pass $search_read_or_user;
        }

        # Quoted regex so {36} is a PCRE quantifier; unquoted { would start an nginx block
        location ~ "^/chats/[0-9a-fA-F-]{36}/messages$" {
            proxy_pass $search_read_or_user;
        }

        location / {
            proxy_pass http://user_service;
        }
    }
}
