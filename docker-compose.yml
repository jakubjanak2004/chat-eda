services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - search-service
      - ws-service

  user-service:
    image: chat-eda-user-service:latest
    build:
      context: .
      dockerfile: user-service/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
#      interval: 10s
#      timeout: 3s
#      retries: 5
#      start_period: 30s
    volumes:
      - user_service_data:/tmp
    networks:
      default:
        aliases:
          - user-service

  search-service:
    image: chat-eda-search-service:latest
    build:
      context: .
      dockerfile: search-service/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
      - kafka
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
#      interval: 10s
#      timeout: 3s
#      retries: 5
#      start_period: 30s
    volumes:
      - search_service_data:/tmp
    networks:
      default:
        aliases:
          - search-service

  ws-service:
    image: chat-eda-ws-service:latest
    deploy:
      replicas: 3 # todo will be 3
    build:
      context: .
      dockerfile: ws-service/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ws-service-$${HOSTNAME}
    depends_on:
      - kafka
#    ports:
#      - "8082:8080"
#    healthcheck:
#      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
#      interval: 10s
#      timeout: 3s
#      retries: 5
#      start_period: 30s
    volumes:
      - ws_service_data:/tmp
    networks:
      default:
        aliases:
          - ws-service

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_eda
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
    volumes:
      - kafka_data:/bitnami/kafka

  elasticsearch:
    # Must match elasticsearch-java on the classpath (Boot 4 → client 9.2.x). ES 8 + client 9 → indices.exists HTTP 400, no body.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      # New name: old volume had ES 8.15 node metadata; ES 9 cannot jump 8.15→9 without 8.19 first (dev: fresh volume is simplest).
      - elasticsearch_data_es9:/usr/share/elasticsearch/data

volumes:
  minio_data:
  postgres_data:
  kafka_data:
  elasticsearch_data_es9:
  user_service_data:
  search_service_data:
  ws_service_data:
