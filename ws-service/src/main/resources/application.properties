spring.application.name=ws_service

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dto.*
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.max-poll-records=${WS_KAFKA_MAX_POLL_RECORDS:1000}
spring.kafka.consumer.fetch-min-bytes=${WS_KAFKA_FETCH_MIN_BYTES:131072}
spring.kafka.consumer.fetch-max-wait=${WS_KAFKA_FETCH_MAX_WAIT:15ms}
spring.kafka.consumer.max-partition-fetch-bytes=${WS_KAFKA_MAX_PARTITION_FETCH_BYTES:1048576}
spring.kafka.consumer.properties.receive.buffer.bytes=${WS_KAFKA_RECEIVE_BUFFER_BYTES:262144}
spring.kafka.listener.concurrency=${WS_KAFKA_LISTENER_CONCURRENCY:8}
app.kafka.ws-group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ws-service}
app.websocket.executor.inbound.core-pool-size=${WS_INBOUND_EXECUTOR_CORE_POOL_SIZE:4}
app.websocket.executor.inbound.max-pool-size=${WS_INBOUND_EXECUTOR_MAX_POOL_SIZE:16}
app.websocket.executor.inbound.queue-capacity=${WS_INBOUND_EXECUTOR_QUEUE_CAPACITY:1000}
app.websocket.executor.outbound.core-pool-size=${WS_OUTBOUND_EXECUTOR_CORE_POOL_SIZE:8}
app.websocket.executor.outbound.max-pool-size=${WS_OUTBOUND_EXECUTOR_MAX_POOL_SIZE:32}
app.websocket.executor.outbound.queue-capacity=${WS_OUTBOUND_EXECUTOR_QUEUE_CAPACITY:5000}

management.endpoints.web.exposure.include=health,info,prometheus
management.server.port=8081